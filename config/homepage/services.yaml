---
- HomeLab Sentinel:
    - Platform:
        description: Canonical Sentinel platform status
        widget:
          type: customapi
          url: http://172.18.0.1:18080/api/v1/status
          refreshInterval: 10000
          mappings:
            - field: overall
              label: Overall
              format: text
            - field: core_api.health
              label: Core API
              format: text
            - field: inventory.database
              label: Inventory
              format: text
            - field: verification.last_result
              label: Verification
              format: text

- Discovery:
    - Discovery Engine:
        description: Sentinel discovery state
        widget:
          type: customapi
          url: http://172.18.0.1:18080/api/v1/status
          refreshInterval: 10000
          mappings:
            - field: discovery.runtime
              label: Runtime
              format: text
            - field: discovery.last_run
              label: Last Run
              format: text
            - field: discovery.freshness
              label: Freshness
              format: text
            - field: discovery.provider
              label: Provider
              format: text

- Service Discovery:
    - Service Discovery Engine:
        id: sentinel-service-discovery
        description: Sentinel service discovery readiness
        widgets:
          - type: customapi
            url: http://172.18.0.1:18080/api/v1/status
            refreshInterval: 10000
            mappings:
              - field: service_discovery.readiness
                label: Readiness
                format: text
              - field: service_discovery.targets
                label: Targets
                format: number
              - field: service_discovery.endpoints.observed
                label: Observed
                format: number
              - field: service_discovery.endpoints.stale
                label: Stale
                format: number
              - field: service_discovery.retry_pool
                label: Retry Pool
                format: number
              - field: service_discovery.normal_timer.runtime
                label: Sweep
                format: text
              - field: service_discovery.retry_timer.runtime
                label: Retry
                format: text
              - field: service_discovery.provider
                label: Provider
                format: text

          - type: customapi
            url: http://172.18.0.1:18080/api/v1/service-discovery
            refreshInterval: 10000
            mappings:
              - field: targets
                label: Detail Targets
                format: number

- Monitoring:
    - Monitoring Engine:
        description: Canonical Sentinel monitoring state
        widget:
          type: customapi
          url: http://172.18.0.1:18080/api/v1/status
          refreshInterval: 10000
          mappings:
            - field: monitoring.collection
              label: Collection
              format: text
            - field: monitoring.targets
              label: Targets
              format: number
            - field: monitoring.entities.healthy
              label: Healthy
              format: number
            - field: monitoring.entities.down
              label: Down
              format: number
