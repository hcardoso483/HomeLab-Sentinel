id: prometheus

name: Prometheus

display_name: Prometheus Metrics

version: 0.1.0
spec_version: "1.1"

category: monitoring

description: Time-series metrics collection and storage engine.

author: HomeLab Sentinel

license: Apache-2.0

status: enabled

source:
  type: docker
  image: prom/prometheus:latest

homepage: https://prometheus.io/

documentation: docs.md

compose: compose.yml

healthcheck: scripts/healthcheck.sh

entrypoints:
  monitoring-observer: scripts/observe.py
  monitoring-target-renderer: scripts/render-targets.py

install: scripts/install.sh

update: scripts/update.sh

uninstall: scripts/uninstall.sh

dependencies:
  - docker

capabilities:
  provides:
    - metrics
    - monitoring

ports:
  - 9090

volumes:
  - prometheus-data

tags:
  - monitoring
  - metrics
  - observability
